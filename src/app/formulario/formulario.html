<div class="formulario">
  <h2>Registrar Estudiante</h2>
  <form (ngSubmit)="registrar()">
    <div class="campo">
      <label for="nombre">Nombre:</label>
      <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Ej: Juan Pérez">
    </div>

    <div class="campo">
      <label for="edad">Edad:</label>
      <input id="edad" type="number" [(ngModel)]="edad" name="edad" placeholder="Ej: 20">
    </div>

    <div class="campo">
      <label for="codigo">Código:</label>
      <input id="codigo" type="text" [(ngModel)]="codigo" name="codigo" placeholder="Ej: A001">
    </div>

    <button type="submit">Agregar Estudiante</button>
  </form>
</div>
