<div class="fila">
  <input #buscarEntrada type="number" placeholder="Buscar número" (keydown.enter)="alBuscar(buscarEntrada)" />
  <button type="button" (click)="alBuscar(buscarEntrada)">Buscar</button>
</div>

<div class="fila">

</div>

<div class="fila">
